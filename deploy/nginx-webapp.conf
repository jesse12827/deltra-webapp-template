# Nginx site. Installed by the Approver as /etc/nginx/sites-available/webapp
# and enabled with a symlink in sites-enabled. Web-App Development Stack, Section 15.
# Replace server_name and certificate paths for the deployment.

server {
    listen 80;
    listen [::]:80;
    server_name webapp.example.deltra;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webapp.example.deltra;

    ssl_certificate     /etc/ssl/webapp/fullchain.pem;
    ssl_certificate_key /etc/ssl/webapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:webapp_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    server_tokens off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    # Health checks come from local monitoring only.
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
