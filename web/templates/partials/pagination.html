{{define "pagination"}}
<nav class="pagination" aria-label="Pagination">
  {{if .PrevURL}}<a href="{{.PrevURL}}" hx-get="{{.PrevURL}}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">Previous</a>{{else}}<span aria-disabled="true">Previous</span>{{end}}
  <span>Page {{.Page.Page}} of {{.Page.Pages}} · {{.Page.Total}} items</span>
  {{if .NextURL}}<a href="{{.NextURL}}" hx-get="{{.NextURL}}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">Next</a>{{else}}<span aria-disabled="true">Next</span>{{end}}
</nav>
{{end}}
