# Lint configuration. Changes to this file are Critical changes
# (Change Management Standard, Section 44).
version: "2"

run:
  timeout: 5m

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - errorlint
    - misspell
  exclusions:
    paths:
      - internal/dbgen     # generated by sqlc

formatters:
  enable:
    - gofmt
